name: Build Browser
permissions: {}

on:
  push:
    branches:
      - build-browser

jobs:
  build_and_package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build Browser
        run: npm run dist:chrome
        working-directory: apps/browser

      - name: Archive production artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-MV3-chrome-${{ github.sha }}
          path: apps/browser/dist/dist-chrome.zip

      - name: Package dev extension
        run: npm run package:dev:chrome
        working-directory: apps/browser

      - name: Archive dev artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dev-MV3-chrome-${{ github.sha }}
          path: apps/browser/dist/dev-chrome.zip
